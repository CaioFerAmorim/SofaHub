# Publica o instalador no GitHub Releases a cada tag "v*" (ex.: git tag v0.7.0 && git push --tags)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Gerar SofaHub.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name SofaHub --icon web\icon.ico
          --add-data "web;web" --add-data "extensao;extensao" --add-data "presets.json;."
          --hidden-import segno sofahub.py

      - name: Versão
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path servidor.py -Pattern '^VERSAO = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".TrimStart("v") -ne $v) {
            throw "A tag ${{ github.ref_name }} não bate com VERSAO=$v em servidor.py"
          }
          "versao=$v" >> $env:GITHUB_OUTPUT

      - name: Gerar instalador
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=${{ steps.v.outputs.versao }}" instalador\SofaHub.iss

      - uses: actions/upload-artifact@v4
        with:
          name: SofaHub-Setup-${{ steps.v.outputs.versao }}
          path: instalador/Output/*.exe

      - name: Publicar no Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: instalador/Output/*.exe
          generate_release_notes: true
